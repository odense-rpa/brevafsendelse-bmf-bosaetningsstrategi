[project]
name = "brevafsendelse-bmf-bosaetningsstrategi"
version = "0.5.0"
description = "Sender velkomstbrev som digital post til nye unge tilflyttere i Odense Kommune (BMF's bosætningsstrategi)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "pymssql",
    "sbsip",
    "datafordeler",
    "odk-tools",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.3.0" }
sbsip = { git = "https://github.com/odense-rpa/sbsip.git" }
datafordeler = { git = "https://github.com/odense-rpa/datafordeler.git" }
odk-tools = { git = "https://github.com/odense-rpa/odk-tools.git" }
